[workspace]
resolver = "2"
members = [
    "crates/melon-proto",
    "crates/melon-world",
    "crates/melon-server",
    "crates/melon-client",
    "crates/melon-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
melon-proto = { path = "crates/melon-proto" }
melon-world = { path = "crates/melon-world" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
wgpu = "25"
winit = "0.30"
pollster = "0.4"

[profile.release]
lto = "thin"
